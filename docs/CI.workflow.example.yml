name: Tests and publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[web,media,dev]"
      - run: python scripts/check_publication.py
      - run: node --check src/yanhe_sentinel/web/static/app.js
      - run: node --check src/yanhe_sentinel/web/static/workspace.js
      - run: node --check src/yanhe_sentinel/web/static/study.js
      - run: node --check src/yanhe_sentinel/web/static/product.js
      - run: node --test tests/navigation.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: ./ui/node_modules/.bin/tsc --noEmit -p ui
      - run: pytest -q
