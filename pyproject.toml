[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanhe-classroom-sentinel"
version = "0.6.0"
description = "Evidence-backed important classroom notice detection"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
media = ["av>=14,<20", "imageio-ffmpeg>=0.6,<1", "numpy>=2,<3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "itsdangerous>=2,<3", "playwright>=1.48,<2", "m3u8>=6,<7"]
asr = ["faster-whisper>=1.2,<2", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
yanhe-sentinel = "yanhe_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yanhe_sentinel = ["data/*.json", "data/*.srt", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
